# Render deployment configuration
# This file configures automatic deployment on Render.com

services:
  - type: web
    name: digital-event-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false  # Set this in Render dashboard from Supabase (Connection pooling URL)
      - key: DIRECT_URL
        sync: false  # Set this in Render dashboard from Supabase (Direct connection URL)
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false  # Set this to your Netlify frontend URL
    # Note: No disk needed - using Supabase PostgreSQL instead of SQLite

