# Render deployment configuration
# This file configures automatic deployment on Render.com
#
# IMPORTANT: PORT Environment Variable
# Render.com may not automatically set PORT for Docker services.
# You MUST manually set PORT in Render.com dashboard:
# 1. Go to your service → Environment tab
# 2. Add: PORT = 10000 (or any port you prefer)
# 3. Save and redeploy
#
# See RENDER_PORT_SETUP.md for detailed instructions

services:
  - type: web
    name: digital-event-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000  # Render.com default is 10000, but explicitly set it here for Docker services
      - key: DATABASE_URL
        sync: false  # REQUIRED: Set this in Render dashboard from Supabase (Connection pooling URL)
      - key: DIRECT_URL
        sync: false  # OPTIONAL: Set this in Render dashboard from Supabase (Direct connection URL)  
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false  # Set this to your Netlify frontend URL (e.g., https://your-app.netlify.app)
    # Note: No disk needed - using Supabase PostgreSQL instead of SQLite

